def getSkiaArtifact() {
    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty("os.arch").toLowerCase()

    boolean arm64 = arch in ["aarch64", "arm64"]

    if (os.isWindows()) {
        return arm64 ? "skija-windows-arm64" : "skija-windows-x64"
    } else if (os.isLinux()) {
        return arm64 ? "skija-linux-arm64" : "skija-linux-x64"
    } else if (os.isMacOsX()) {
        return arm64 ? "skija-macos-arm64" : "skija-macos-x64"
    } else {
        throw new GradleException("Unsupported platform: ${System.getProperty("os.name")} ${arch}")
    }
}

